# SSH Daemon Hardening - Drop-in for /etc/ssh/sshd_config.d/99-hardening.conf

# Authentication
PermitRootLogin no
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
ChallengeResponseAuthentication no
UsePAM yes

# Forwarding & Tunneling
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
PermitTunnel no

# Session Limits
ClientAliveInterval 300
ClientAliveCountMax 2
MaxAuthTries 3
LoginGraceTime 30

# Cryptography (modern, secure defaults - OpenSSH 7.4+)
Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com
MACs hmac-sha2-256-etm@openssh.com,hmac-sha2-512-etm@openssh.com
KexAlgorithms curve25519-sha256,curve25519-sha256@libssh.org

# Optional: restrict users/groups (uncomment and adjust)
# AllowUsers admin@192.168.22.0/24
# AllowGroups sshusers

# Optional: banner
# Banner /etc/issue.net